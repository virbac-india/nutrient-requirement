<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrient Requirement Diagnostic System</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #059669;
      --warning: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 16px;
    }
    h2, h3, h4 {
      margin-top: 0;
      color: var(--primary);
    }
    label {
      font-weight: 600;
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }
    select, input, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      background-color: var(--secondary);
      color: white;
      font-weight: 700;
      border: none;
      margin-top: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #047857;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .metric-box {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .metric-box label {
      font-size: 12px;
      color: #64748b;
      margin: 0;
    }
    .metric-box .val {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      margin-top: 4px;
    }
    .metric-box.danger .val {
      color: var(--warning);
    }
    .table-container {
      overflow-x: auto;
      margin-top: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #1e293b;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f8fafc;
    }
    .alert {
      padding: 12px;
      border-radius: 8px;
      background-color: #fef2f2;
      border-left: 4px solid var(--warning);
      color: #991b1b;
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h2>🐔 Nutrient Requirement</h2>
    <p style="font-size:13px; color:#64748b; margin-bottom:12px;">Standard baseline synced with NRC guidelines.</p>
    
    <label for="age">Bird Age / Phase Stage:</label>
    <select id="age">
      <option value="7" selected>Day 7 (Week I)</option>
      <option value="14">Day 14 (Week II)</option>
      <option value="21">Day 21 (Week III)</option>
      <option value="28">Day 28 (Week IV)</option>
      <option value="35">Day 35 (Week V)</option>
      <option value="42">Day 42 (Week VI)</option>
      <option value="49">Day 49 (Week VII)</option>
      <option value="56">Day 56 (Week VIII)</option>
    </select>

    <label for="actualBW">Observed Average Weight (grams / bird):</label>
    <input type="number" id="actualBW" value="170" step="1">

    <label for="flockSize">Total Flock Size (Number of Birds):</label>
    <input type="number" id="flockSize" value="10000" step="500">

    <button onclick="calculate()">Calculate Deficit & Requirements</button>
  </div>

  <div class="card" id="results" style="display:none;">
    <h3>📊 Diagnostic Summary</h3>
    
    <div class="metrics-grid">
      <div class="metric-box">
        <label>Target Body Weight</label>
        <div class="val" id="stdBWDisplay">-</div>
      </div>
      <div class="metric-box">
        <label>Observed Weight</label>
        <div class="val" id="actBWDisplay">-</div>
      </div>
      <div class="metric-box danger">
        <label>Weight Deficit</label>
        <div class="val" id="bwDefDisplay">-</div>
      </div>
      <div class="metric-box">
        <label>Extra Feed Needed</label>
        <div class="val" id="feedNeedDisplay">-</div>
      </div>
    </div>

    <div id="alertBox" class="alert"></div>

    <h4 style="margin-top:20px;">🧪 Deficit Recovery Breakdown</h4>
    <div class="table-container">
      <table id="nutrientTable">
        <thead>
          <tr>
            <th>Nutrient</th>
            <th>Diet Requirement</th>
            <th>Deficit / Bird</th>
            <th>Flock Deficit Total</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // Standard dataset updated from official NRC reference chart
  const stdData = {
    '1': {bw: 92, fcr: 0.24, phase: 'Starter'},
    '2': {bw: 115, fcr: 0.40, phase: 'Starter'},
    '3': {bw: 135, fcr: 0.53, phase: 'Starter'},
    '4': {bw: 158, fcr: 0.64, phase: 'Starter'},
    '5': {bw: 178, fcr: 0.75, phase: 'Starter'},
    '6': {bw: 201, fcr: 0.85, phase: 'Starter'},
    '7': {bw: 221, fcr: 0.95, phase: 'Starter'},
    'Week I': {bw: 221, fcr: 0.95, phase: 'Starter'},
    '8': {bw: 264, fcr: 0.97, phase: 'Starter'},
    '9': {bw: 301, fcr: 1.00, phase: 'Starter'},
    '10': {bw: 338, fcr: 1.03, phase: 'Starter'},
    '11': {bw: 377, fcr: 1.07, phase: 'Starter'},
    '12': {bw: 413, fcr: 1.11, phase: 'Starter'},
    '13': {bw: 450, fcr: 1.16, phase: 'Starter'},
    '14': {bw: 487, fcr: 1.20, phase: 'Starter'},
    'Week II': {bw: 487, fcr: 1.20, phase: 'Starter'},
    '15': {bw: 564, fcr: 1.20, phase: 'Starter'},
    '16': {bw: 621, fcr: 1.21, phase: 'Starter'},
    '17': {bw: 678, fcr: 1.23, phase: 'Starter'},
    '18': {bw: 737, fcr: 1.24, phase: 'Starter'},
    '19': {bw: 793, fcr: 1.26, phase: 'Starter'},
    '20': {bw: 850, fcr: 1.29, phase: 'Starter'},
    '21': {bw: 907, fcr: 1.31, phase: 'Starter'},
    'Week III': {bw: 907, fcr: 1.31, phase: 'Starter'},
    '22': {bw: 1008, fcr: 1.31, phase: 'Grower'},
    '23': {bw: 1085, fcr: 1.32, phase: 'Grower'},
    '24': {bw: 1165, fcr: 1.33, phase: 'Grower'},
    '25': {bw: 1242, fcr: 1.35, phase: 'Grower'},
    '26': {bw: 1322, fcr: 1.37, phase: 'Grower'},
    '27': {bw: 1399, fcr: 1.39, phase: 'Grower'},
    '28': {bw: 1479, fcr: 1.41, phase: 'Grower'},
    'Week IV': {bw: 1479, fcr: 1.41, phase: 'Grower'},
    '29': {bw: 1566, fcr: 1.43, phase: 'Grower'},
    '30': {bw: 1649, fcr: 1.45, phase: 'Grower'},
    '31': {bw: 1732, fcr: 1.47, phase: 'Grower'},
    '32': {bw: 1813, fcr: 1.48, phase: 'Grower'},
    '33': {bw: 1897, fcr: 1.50, phase: 'Grower'},
    '34': {bw: 1980, fcr: 1.52, phase: 'Grower'},
    '35': {bw: 2063, fcr: 1.54, phase: 'Grower'},
    'Week V': {bw: 2063, fcr: 1.54, phase: 'Grower'},
    '36': {bw: 2162, fcr: 1.56, phase: 'Grower'},
    '37': {bw: 2255, fcr: 1.57, phase: 'Grower'},
    '38': {bw: 2345, fcr: 1.59, phase: 'Grower'},
    '39': {bw: 2438, fcr: 1.61, phase: 'Grower'},
    '40': {bw: 2528, fcr: 1.63, phase: 'Grower'},
    '41': {bw: 2621, fcr: 1.66, phase: 'Grower'},
    '42': {bw: 2711, fcr: 1.68, phase: 'Grower'},
    'Week VI': {bw: 2711, fcr: 1.68, phase: 'Grower'},
    '43': {bw: 2832, fcr: 1.70, phase: 'Finisher'},
    '44': {bw: 2936, fcr: 1.71, phase: 'Finisher'},
    '45': {bw: 3043, fcr: 1.73, phase: 'Finisher'},
    '46': {bw: 3149, fcr: 1.74, phase: 'Finisher'},
    '47': {bw: 3255, fcr: 1.75, phase: 'Finisher'},
    '48': {bw: 3359, fcr: 1.77, phase: 'Finisher'},
    '49': {bw: 3466, fcr: 1.78, phase: 'Finisher'},
    'Week VII': {bw: 3466, fcr: 1.78, phase: 'Finisher'},
    '50': {bw: 3602, fcr: 1.78, phase: 'Finisher'},
    '51': {bw: 3725, fcr: 1.79, phase: 'Finisher'},
    '52': {bw: 3845, fcr: 1.79, phase: 'Finisher'},
    '53': {bw: 3968, fcr: 1.80, phase: 'Finisher'},
    '54': {bw: 4088, fcr: 1.80, phase: 'Finisher'},
    '55': {bw: 4211, fcr: 1.81, phase: 'Finisher'},
    '56': {bw: 4331, fcr: 1.81, phase: 'Finisher'},
    'Week VIII': {bw: 4331, fcr: 1.81, phase: 'Finisher'}
  };

  const nutrients = [
    {name: "Crude protein", unit: "%", Starter: 23.0, Grower: 20.0, Finisher: 18.0},
    {name: "Arginine", unit: "%", Starter: 1.25, Grower: 1.10, Finisher: 1.00},
    {name: "Glycine + serine", unit: "%", Starter: 1.25, Grower: 1.14, Finisher: 0.97},
    {name: "Lysine", unit: "%", Starter: 1.10, Grower: 1.00, Finisher: 0.85},
    {name: "Methionine", unit: "%", Starter: 0.50, Grower: 0.38, Finisher: 0.32},
    {name: "Methionine + cystine", unit: "%", Starter: 0.90, Grower: 0.72, Finisher: 0.60},
    {name: "Threonine", unit: "%", Starter: 0.80, Grower: 0.74, Finisher: 0.68},
    {name: "Calcium", unit: "%", Starter: 1.00, Grower: 0.90, Finisher: 0.80},
    {name: "Nonphytate phosphorus", unit: "%", Starter: 0.45, Grower: 0.35, Finisher: 0.30},
    {name: "Sodium", unit: "%", Starter: 0.20, Grower: 0.15, Finisher: 0.12},
    {name: "Choline", unit: "mg", Starter: 1300, Grower: 1000, Finisher: 750},
    {name: "Manganese", unit: "mg", Starter: 60, Grower: 60, Finisher: 60},
    {name: "Zinc", unit: "mg", Starter: 40, Grower: 40, Finisher: 40},
    {name: "Vitamin A", unit: "IU", Starter: 1500, Grower: 1500, Finisher: 1500},
    {name: "Vitamin D₃", unit: "ICU", Starter: 200, Grower: 200, Finisher: 200},
    {name: "Vitamin E", unit: "IU", Starter: 10, Grower: 10, Finisher: 10}
  ];

  function calculate() {
    const age = document.getElementById('age').value;
    const actualBW = parseFloat(document.getElementById('actualBW').value);
    const flockSize = parseInt(document.getElementById('flockSize').value);

    const benchmark = stdData[age];
    const stdBW = benchmark.bw;
    const fcr = benchmark.fcr;
    const phase = benchmark.phase;

    const bwDeficit = Math.max(0, stdBW - actualBW);
    const catchupFeedGrams = bwDeficit * fcr;
    const flockExtraFeedKg = (catchupFeedGrams * flockSize) / 1000;

    document.getElementById('results').style.display = 'block';
    document.getElementById('stdBWDisplay').innerText = stdBW + ' g';
    document.getElementById('actBWDisplay').innerText = actualBW + ' g';
    document.getElementById('bwDefDisplay').innerText = bwDeficit.toFixed(1) + ' g';
    document.getElementById('feedNeedDisplay').innerText = catchupFeedGrams.toFixed(1) + ' g/bird';

    const alertBox = document.getElementById('alertBox');
    if (bwDeficit > 0) {
      alertBox.style.display = 'block';
      alertBox.innerHTML = `⚠️ Flock is <b>${bwDeficit.toFixed(1)} g underweight</b>. Extra feed needed across ${flockSize.toLocaleString()} birds to recover target weight: <b>${flockExtraFeedKg.toFixed(2)} kg</b>.`;
    } else {
      alertBox.style.display = 'none';
    }

    const tbody = document.querySelector('#nutrientTable tbody');
    tbody.innerHTML = '';

    nutrients.forEach(n => {
      const req = n[phase];
      let defBird = 0;
      let defFlockFormatted = '';
      let dispUnit = '';

      if (n.unit === '%') {
        defBird = (req / 100.0) * catchupFeedGrams;
        const flockKg = (defBird * flockSize) / 1000.0;
        dispUnit = 'g';
        defFlockFormatted = flockKg.toFixed(2) + ' kg';
      } else if (n.unit === 'mg') {
        defBird = (req / 1000.0) * catchupFeedGrams;
        const flockKg = (defBird * flockSize) / 1000000.0;
        dispUnit = 'mg';
        defFlockFormatted = (flockKg >= 1) ? flockKg.toFixed(2) + ' kg' : (flockKg * 1000).toFixed(1) + ' g';
      } else { // IU / ICU
        defBird = (req / 1000.0) * catchupFeedGrams;
        const flockTotal = defBird * flockSize;
        dispUnit = n.unit;
        defFlockFormatted = flockTotal.toLocaleString(undefined, {maximumFractionDigits: 0}) + ' ' + n.unit;
      }

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${n.name}</b></td>
        <td>${req} ${n.unit}${n.unit !== '%' ? '/kg' : ''}</td>
        <td>${defBird.toFixed(3)} ${dispUnit}</td>
        <td><b>${defFlockFormatted}</b></td>
      `;
      tbody.appendChild(tr);
    });
  }
</script>

</body>
</html>
