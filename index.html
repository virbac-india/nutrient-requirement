<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrient Requirement Diagnostic System</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #059669;
      --warning: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 16px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      margin-bottom: 14px;
    }
    .brand-logo {
      height: 38px;
      width: auto;
    }
    h1.main-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      margin: 20px 0 4px 0;
      letter-spacing: -0.5px;
    }
    h2, h3, h4 {
      margin-top: 0;
      color: var(--primary);
    }
    .sub-title {
      font-size: 18px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 14px;
    }
    label {
      font-weight: 600;
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }
    select, input, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      background-color: var(--secondary);
      color: white;
      font-weight: 700;
      border: none;
      margin-top: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #047857;
    }
    .stage-badge-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .badge {
      background: #e2e8f0;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
    }
    .badge.active {
      background: #1e3a8a;
      color: white;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .metric-box {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .metric-box label {
      font-size: 12px;
      color: #64748b;
      margin: 0;
    }
    .metric-box .val {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      margin-top: 4px;
    }
    .metric-box.danger .val {
      color: var(--warning);
    }
    .table-container {
      overflow-x: auto;
      margin-top: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #1e293b;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f8fafc;
    }
    .alert {
      padding: 12px;
      border-radius: 8px;
      background-color: #fef2f2;
      border-left: 4px solid var(--warning);
      color: #991b1b;
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="logo-container">
      <img src="https://in.virbac.com/modules/virbac-static-resources-module/img/template/logo-virbac.svg" alt="Virbac Logo" class="brand-logo">
    </div>

    <h2>🐔 Nutrient Requirement</h2>
    <p style="font-size:13px; color:#64748b; margin-bottom:12px;">Standard baseline synced with NRC guidelines.</p>
    
    <div class="stage-badge-container">
      <div id="badge1" class="badge">0 to 3 Weeks (Starter)</div>
      <div id="badge2" class="badge">3 to 6 Weeks (Grower)</div>
      <div id="badge3" class="badge">6 to 8 Weeks (Finisher)</div>
    </div>
    
    <label for="age">Select Age / Week Stage:</label>
    <select id="age" onchange="updateStageBadge()">
      <option value="7" selected>Day 7 (Week I: 0 to 3 Weeks)</option>
      <option value="14">Day 14 (Week II: 0 to 3 Weeks)</option>
      <option value="21">Day 21 (Week III: 0 to 3 Weeks)</option>
      <option value="28">Day 28 (Week IV: 3 to 6 Weeks)</option>
      <option value="35">Day 35 (Week V: 3 to 6 Weeks)</option>
      <option value="42">Day 42 (Week VI: 3 to 6 Weeks)</option>
      <option value="49">Day 49 (Week VII: 6 to 8 Weeks)</option>
      <option value="56">Day 56 (Week VIII: 6 to 8 Weeks)</option>
    </select>

    <label for="actualBW">Observed Average Weight (grams / bird):</label>
    <input type="number" id="actualBW" value="180" step="1">

    <label for="flockSize">Total Flock Size (Number of Birds):</label>
    <input type="number" id="flockSize" value="10000" step="500">

    <button onclick="calculate()">Calculate Requirements</button>
  </div>

  <div class="card" id="results" style="display:none;">
    <h3>📊 Diagnostic Summary (<span id="phaseDisplay"></span>)</h3>
    
    <div class="metrics-grid">
      <div class="metric-box">
        <label>Target Body Weight</label>
        <div class="val" id="stdBWDisplay">-</div>
      </div>
      <div class="metric-box">
        <label>Observed Weight</label>
        <div class="val" id="actBWDisplay">-</div>
      </div>
      <div class="metric-box danger">
        <label>Weight Deficit</label>
        <div class="val" id="bwDefDisplay">-</div>
      </div>
      <div class="metric-box">
        <label>Extra Feed Needed</label>
        <div class="val" id="feedNeedDisplay">-</div>
      </div>
    </div>

    <div id="alertBox" class="alert"></div>

    <h1 class="main-title">Restore the Core</h1>
    <div class="sub-title">🧪 Recovery Breakdown</div>

    <div class="table-container">
      <table id="nutrientTable">
        <thead>
          <tr>
            <th>Category / Nutrient</th>
            <th>Diet Requirement</th>
            <th>Deficit / Bird</th>
            <th>Flock Deficit Total</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

  const nutrients = [
    {name: "Crude protein", unit: "%", w0_3: 23.0, w3_6: 20.0, w6_8: 18.0},
    {name: "Arginine", unit: "%", w0_3: 1.25, w3_6: 1.10, w6_8: 1.00},

  ];

  function updateStageBadge() {
    const age = document.getElementById('age').value;
    const benchmark = stdData[age];
    
    document.getElementById('badge1').classList.remove('active');
    document.getElementById('badge2').classList.remove('active');
    document.getElementById('badge3').classList.remove('active');

    if (benchmark.phaseKey === 'w0_3') {
      document.getElementById('badge1').classList.add('active');
    } else if (benchmark.phaseKey === 'w3_6') {
      document.getElementById('badge2').classList.add('active');
    } else {
      document.getElementById('badge3').classList.add('active');
    }
  }

  function calculate() {
    const age = document.getElementById('age').value;
    const actualBW = parseFloat(document.getElementById('actualBW').value);
    const flockSize = parseInt(document.getElementById('flockSize').value);

    const benchmark = stdData[age];
    const stdBW = benchmark.bw;
    const fcr = benchmark.fcr;
    const phaseKey = benchmark.phaseKey;
    const phaseLabel = benchmark.phaseLabel;

    const bwDeficit = Math.max(0, stdBW - actualBW);
    const catchupFeedGrams = bwDeficit * fcr;
    const flockExtraFeedKg = (catchupFeedGrams * flockSize) / 1000;

    document.getElementById('results').style.display = 'block';
    document.getElementById('phaseDisplay').innerText = phaseLabel;
    document.getElementById('stdBWDisplay').innerText = stdBW + ' g';
    document.getElementById('actBWDisplay').innerText = actualBW + ' g';
    document.getElementById('bwDefDisplay').innerText = bwDeficit.toFixed(1) + ' g';
    document.getElementById('feedNeedDisplay').innerText = catchupFeedGrams.toFixed(1) + ' g/bird';

    const alertBox = document.getElementById('alertBox');
    if (bwDeficit > 0) {
      alertBox.style.display = 'block';
      alertBox.innerHTML = `⚠️ Flock is <b>${bwDeficit.toFixed(1)} g underweight</b> in the <b>${phaseLabel}</b>. Additional balanced feed required across ${flockSize.toLocaleString()} birds: <b>${flockExtraFeedKg.toFixed(2)} kg</b>.`;
    } else {
      alertBox.style.display = 'none';
    }

    const tbody = document.querySelector('#nutrientTable tbody');
    tbody.innerHTML = '';

    nutrients.forEach(n => {
      const req = n[phaseKey];
      let defBird = 0;
      let defFlock = 0;
      let dispUnit = n.unit; // Strictly match the requirement unit tag (%)
      let defFlockFormatted = '';

      if (n.unit === '%') {
        defBird = (req / 100.0) * catchupFeedGrams;
        defFlock = defBird * flockSize;
        defFlockFormatted = defFlock.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' %';
      } else if (n.unit === 'mg') {
        defBird = (req / 1000.0) * catchupFeedGrams;
        defFlock = defBird * flockSize;
        defFlockFormatted = defFlock.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' mg';
      } else { // IU / ICU
        defBird = (req / 1000.0) * catchupFeedGrams;
        defFlock = defBird * flockSize;
        defFlockFormatted = defFlock.toLocaleString(undefined, {maximumFractionDigits: 0}) + ' ' + n.unit;
      }

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${n.name}</b></td>
        <td>${req} ${n.unit}${n.unit !== '%' ? '/kg' : ''}</td>
        <td>${defBird.toFixed(3)} ${dispUnit}</td>
        <td><b>${defFlockFormatted}</b></td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Initialize active stage badge on load
  updateStageBadge();
</script>

</body>
</html>
